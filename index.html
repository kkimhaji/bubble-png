<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>말풍선 메이커</title>
  </head>
  <body>
    <div id="app">
      <div class="panel">
        <label>
          말풍선 모양
          <select id="bubble-select"></select>
        </label>

        <label>
          폰트
          <select id="font-select"></select>
        </label>

        <label>
          문구
          <textarea
            id="text-input"
            rows="3"
            placeholder="문구를 입력하세요"
          ></textarea>
        </label>

        <label>
          말풍선 너비(px)
          <div class="size-control">
            <input id="bubble-width" type="number" min="20" />
            <input id="bubble-width-range" type="range" min="20" />
          </div>
        </label>
        
        <label>
          말풍선 높이(px)
          <div class="size-control">
            <input id="bubble-height" type="number" min="20" />
            <input id="bubble-height-range" type="range" min="20" />
          </div>
        </label>
        
        <label class="checkbox-label">
          <input id="lock-aspect" type="checkbox" checked /> 가로세로 비율 고정
        </label>

        <label>
          폰트 크기
          <input id="font-size" type="range" min="10" max="120" value="24" />
        </label>

        <label>
          글자 색상
          <input id="text-color" type="color" value="#000000" />
        </label>
        <div class="button-row">
          <button id="flip-h" type="button">좌우 반전</button>
          <button id="flip-v" type="button">상하 반전</button>
        </div>

        <button id="export-btn" type="button" class="export-btn">
          PNG로 저장
        </button>
      </div>

      <div id="stage-container"></div>
    </div>
    <div id="export-modal" class="export-modal" hidden>
      <div class="export-modal-inner">
        <p>이미지를 꾹 눌러서 '사진에 저장' 또는 '이미지 복사'를 선택하세요.</p>
        <img id="export-result-img" alt="말풍선 결과 이미지" />
        <button id="export-modal-close" type="button">닫기</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
